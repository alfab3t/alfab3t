<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="100%" height="100%">
  <defs>
    <!-- Background Gradient: Deep Astra Blue to Cyber Cobalt -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020B1A"/>
      <stop offset="35%" stop-color="#002D62"/>
      <stop offset="70%" stop-color="#0059AB"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>

    <!-- Glowing Accent Gradient -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="60%" stop-color="#F0F9FF"/>
      <stop offset="100%" stop-color="#7DD3FC"/>
    </linearGradient>

    <!-- Subtle Grid Pattern -->
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="rgba(255, 255, 255, 0.04)" stroke-width="1"/>
    </pattern>

    <!-- Glowing Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <style>
    .name-title {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 38px;
      font-weight: 800;
      letter-spacing: 0.5px;
      fill: url(#textGrad);
    }
    .sub-role {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 19px;
      font-weight: 500;
      fill: #BAE6FD;
      letter-spacing: 0.2px;
    }
    .contact-item {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 15px;
      font-weight: 500;
      fill: #F0F9FF;
    }
    .pulse-circle {
      animation: pulse 3s infinite ease-in-out;
    }
    @keyframes pulse {
      0% { opacity: 0.25; transform: scale(1); }
      50% { opacity: 0.5; transform: scale(1.08); }
      100% { opacity: 0.25; transform: scale(1); }
    }
  </style>

  <!-- Background Base -->
  <rect width="1200" height="340" rx="16" fill="url(#bgGrad)"/>
  <rect width="1200" height="340" rx="16" fill="url(#grid)"/>

  <!-- Futuristic Ambient Light Orbs -->
  <circle cx="1050" cy="80" r="160" fill="#38BDF8" opacity="0.18" filter="url(#glow)"/>
  <circle cx="150" cy="280" r="120" fill="#0059AB" opacity="0.3" filter="url(#glow)"/>
  <circle cx="1120" cy="260" r="90" fill="#0284C7" opacity="0.22" filter="url(#glow)"/>

  <!-- Decorative Accent Tech Lines -->
  <path d="M 0 338 L 1200 338" stroke="url(#textGrad)" stroke-width="2.5" opacity="0.4"/>
  <path d="M 60 70 L 60 270" stroke="#38BDF8" stroke-width="3" stroke-linecap="round" opacity="0.8"/>

  <!-- Content Group -->
  <g transform="translate(85, 0)">
    
    <!-- Status Chip / Badge -->
    <g transform="translate(0, 50)">
      <rect width="215" height="28" rx="14" fill="rgba(56, 189, 248, 0.15)" stroke="rgba(56, 189, 248, 0.4)" stroke-width="1"/>
      <circle cx="15" cy="14" r="5" fill="#38BDF8" class="pulse-circle"/>
      <text x="28" y="19" font-family="'Inter', sans-serif" font-size="12" font-weight="600" fill="#E0F2FE" letter-spacing="0.5">FULLSTACK &amp; NATIVE</text>
    </g>

    <!-- Main Full Name -->
    <text x="0" y="125" class="name-title">Djohan Bagus Satrya Wicaksana</text>

    <!-- Subtitle / Major -->
    <text x="0" y="162" class="sub-role">Scholarship Student • Informatics Management @ Politeknik Astra</text>

    <!-- Separator Line -->
    <line x1="0" y1="195" x2="880" y2="195" stroke="rgba(255, 255, 255, 0.15)" stroke-width="1.2"/>

    <!-- Contact & Social Details Bar -->
    <g transform="translate(0, 235)">

      <!-- WhatsApp Section -->
      <g transform="translate(0, 0)">
        <circle cx="14" cy="12" r="14" fill="#25D366" opacity="0.2"/>
        <!-- WhatsApp Icon SVG Path -->
        <path d="M14 3 C9.03 3 5 7.03 5 12 C5 13.68 5.46 15.26 6.27 16.63 L5 21 L9.53 19.81 C10.87 20.57 12.4 21 14 21 C18.97 21 23 16.97 23 12 C23 7.03 18.97 3 14 3 Z M17.96 15.76 C17.79 16.24 16.99 16.65 16.6 16.69 C16.24 16.73 15.76 16.74 15.21 16.56 C14.88 16.45 14.44 16.3 13.85 16.05 C11.36 14.97 9.74 12.43 9.61 12.26 C9.5 12.1 8.57 10.87 8.57 9.58 C8.57 8.3 9.23 7.67 9.47 7.42 C9.68 7.2 9.94 7.15 10.13 7.15 C10.27 7.15 10.4 7.16 10.51 7.16 C10.74 7.17 10.86 7.18 11.01 7.55 C11.2 8.01 11.66 9.15 11.72 9.27 C11.78 9.39 11.82 9.54 11.74 9.7 C11.66 9.87 11.6 9.95 11.48 10.09 C11.36 10.23 11.23 10.4 11.13 10.51 C11.01 10.64 10.88 10.78 11.03 11.03 C11.17 11.28 11.68 12.11 12.43 12.78 C13.4 13.64 14.2 13.91 14.45 14.03 C14.7 14.16 14.85 14.13 15 13.96 C15.15 13.78 15.65 13.2 15.82 12.95 C16 12.7 16.18 12.74 16.41 12.82 C16.64 12.91 17.89 13.52 18.14 13.65 C18.39 13.77 18.55 13.84 18.61 13.95 C18.68 14.06 18.68 14.58 17.96 15.76 Z" fill="#25D366"/>
        <text x="36" y="17" class="contact-item">0859-4354-9411</text>
      </g>

      <!-- Email Section -->
      <g transform="translate(240, 0)">
        <circle cx="14" cy="12" r="14" fill="#EA4335" opacity="0.2"/>
        <!-- Gmail Icon SVG Path -->
        <path d="M6 7 L6 17 C6 17.55 6.45 18 7 18 L9 18 L9 11.5 L14 15 L19 11.5 L19 18 L21 18 C21.55 18 22 17.55 22 17 L22 7 C22 6.2 21.1 5.75 20.45 6.2 L14 11 L7.55 6.2 C6.9 5.75 6 6.2 6 7 Z" fill="#EA4335"/>
        <text x="36" y="17" class="contact-item">djohanbaw001@gmail.com</text>
      </g>

      <!-- LinkedIn Section -->
      <g transform="translate(545, 0)">
        <circle cx="14" cy="12" r="14" fill="#0A66C2" opacity="0.25"/>
        <!-- LinkedIn Icon SVG Path -->
        <path d="M7 6 C7 6.83 6.33 7.5 5.5 7.5 C4.67 7.5 4 6.83 4 6 C4 5.17 4.67 4.5 5.5 4.5 C6.33 4.5 7 5.17 7 6 Z M4 9 L7 9 L7 19 L4 19 L4 9 Z M9 9 L11.8 9 L11.8 10.4 C12.2 9.6 13.2 9 14.5 9 C17.5 9 18 11 18 13.6 L18 19 L15 19 L15 14.2 C15 13 14.9 11.5 13.3 11.5 C11.6 11.5 11.3 12.8 11.3 14.1 L11.3 19 L8.3 19 L8.3 9 L9 9 Z" fill="#38BDF8"/>
        <text x="36" y="17" class="contact-item">in/djohan-manajemen-informatika</text>
      </g>

    </g>

  </g>
</svg>
