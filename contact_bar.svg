<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 56" width="100%" height="56">
  <defs>
    <!-- Card Gradients -->
    <linearGradient id="waGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F0FDF4"/>
    </linearGradient>
    <linearGradient id="mailGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#FEF2F2"/>
    </linearGradient>
    <linearGradient id="liGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F0F9FF"/>
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="cardShadow" x="-10%" y="-20%" width="120%" height="150%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.08"/>
    </filter>
  </defs>

  <style>
    .card-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-size: 13.5px;
      font-weight: 500;
      fill: #334155;
    }
    .card-val {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-size: 13.5px;
      font-weight: 700;
    }
  </style>

  <!-- 1. WHATSAPP CARD -->
  <g transform="translate(10, 4)">
    <!-- Outer Card Background with Border & Shadow -->
    <rect width="250" height="46" rx="23" fill="url(#waGrad)" stroke="#22C55E" stroke-width="1.5" filter="url(#cardShadow)"/>
    
    <!-- WhatsApp Icon Circle Base -->
    <circle cx="26" cy="23" r="15" fill="#25D366"/>
    <!-- WA Icon SVG Graphic -->
    <path d="M26 13 C20.48 13 16 17.48 16 23 C16 24.87 16.51 26.62 17.41 28.14 L16 33 L21.03 31.68 C22.52 32.52 24.22 33 26 33 C31.52 33 36 28.52 36 23 C36 17.48 31.52 13 26 13 Z M30.4 27.18 C30.21 27.71 29.32 28.17 28.89 28.21 C28.49 28.26 27.96 28.27 27.35 28.07 C26.98 27.94 26.49 27.78 25.84 27.5 C23.07 26.3 21.27 23.48 21.13 23.29 C21 23.11 20 21.75 20 20.31 C20 18.89 20.73 18.19 21 17.91 C21.23 17.67 21.52 17.61 21.73 17.61 C21.89 17.61 22.03 17.62 22.15 17.62 C22.41 17.63 22.54 17.64 22.71 18.06 C22.92 18.57 23.43 19.84 23.5 19.97 C23.57 20.1 23.61 20.27 23.52 20.44 C23.43 20.63 23.37 20.72 23.23 20.88 C23.1 21.03 22.96 21.22 22.84 21.34 C22.71 21.49 22.57 21.64 22.73 21.92 C22.89 22.2 23.46 23.12 24.29 23.87 C25.37 24.83 26.26 25.13 26.54 25.26 C26.82 25.41 26.98 25.37 27.15 25.18 C27.32 24.98 27.87 24.33 28.06 24.06 C28.26 23.78 28.46 23.82 28.72 23.91 C28.97 24.01 30.36 24.69 30.64 24.83 C30.92 24.97 31.1 25.04 31.17 25.17 C31.24 25.29 31.24 25.87 30.4 27.18 Z" fill="#FFFFFF"/>

    <!-- Labels -->
    <text x="50" y="27" class="card-text">WhatsApp: <tspan class="card-val" fill="#15803D">0859-4354-9411</tspan></text>
  </g>

  <!-- 2. GMAIL CARD -->
  <g transform="translate(290, 4)">
    <!-- Outer Card Background with Border & Shadow -->
    <rect width="320" height="46" rx="23" fill="url(#mailGrad)" stroke="#EF4444" stroke-width="1.5" filter="url(#cardShadow)"/>
    
    <!-- Gmail Icon Circle Base -->
    <circle cx="26" cy="23" r="15" fill="#EA4335"/>
    <!-- Gmail Envelope Icon -->
    <path d="M18 17 L18 29 C18 29.55 18.45 30 19 30 L21 30 L21 21.5 L26 25 L31 21.5 L31 30 L33 30 C33.55 30 34 29.55 34 29 L34 17 C34 16.2 33.1 15.75 32.45 16.2 L26 21 L19.55 16.2 C18.9 15.75 18 16.2 18 17 Z" fill="#FFFFFF"/>

    <!-- Labels -->
    <text x="50" y="27" class="card-text">Gmail: <tspan class="card-val" fill="#B91C1C">djohanbaw001@gmail.com</tspan></text>
  </g>

  <!-- 3. LINKEDIN CARD -->
  <g transform="translate(640, 4)">
    <!-- Outer Card Background with Border & Shadow -->
    <rect width="295" height="46" rx="23" fill="url(#liGrad)" stroke="#0284C7" stroke-width="1.5" filter="url(#cardShadow)"/>
    
    <!-- LinkedIn Icon Circle Base -->
    <circle cx="26" cy="23" r="15" fill="#0A66C2"/>
    <!-- LinkedIn Icon Graphic -->
    <path d="M19 18 C19 18.83 18.33 19.5 17.5 19.5 C16.67 19.5 16 18.83 16 18 C16 17.17 16.67 16.5 17.5 16.5 C18.33 16.5 19 17.17 19 18 Z M16 21 L19 21 L19 30 L16 30 Z M21 21 L23.8 21 L23.8 22.4 C24.2 21.6 25.2 21 26.5 21 C29.5 21 30 23 30 25.6 L30 30 L27 30 L27 26.2 C27 25 26.9 23.5 25.3 23.5 C23.6 23.5 23.3 24.8 23.3 26.1 L23.3 30 L20.3 30 Z" fill="#FFFFFF"/>

    <!-- Labels -->
    <text x="50" y="27" class="card-text">LinkedIn: <tspan class="card-val" fill="#0369A1">Djohan Baw</tspan></text>
  </g>
</svg>
