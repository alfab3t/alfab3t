<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 440" width="100%" height="440">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F8FAFC"/>
    </linearGradient>
    <linearGradient id="blueAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0059AB"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
    <linearGradient id="emeraldAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>
    <linearGradient id="purpleAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7C3AED"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>
    <linearGradient id="amberAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D97706"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>

    <!-- Card Shadow -->
    <filter id="cardShadow" x="-5%" y="-10%" width="110%" height="125%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#0F172A" flood-opacity="0.06"/>
    </filter>
  </defs>

  <style>
    .card-title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 15px; font-weight: 700; fill: #0F172A; }
    .card-subtitle { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 11px; font-weight: 700; letter-spacing: 0.6px; }
    .tag-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 11px; font-weight: 600; fill: #334155; }
    .badge-bg { fill: #F1F5F9; rx: 6px; }
    .badge-blue { fill: #E0F2FE; rx: 6px; }
    .badge-emerald { fill: #D1FAE5; rx: 6px; }
    .badge-purple { fill: #EDE9FE; rx: 6px; }
    .badge-amber { fill: #FEF3C7; rx: 6px; }
  </style>

  <!-- ================= QUADRANT 1: BACKEND & ARCHITECTURE ================= -->
  <g transform="translate(15, 15)">
    <!-- Base Card -->
    <rect width="445" height="195" rx="14" fill="url(#cardGrad)" stroke="#E2E8F0" stroke-width="1.2" filter="url(#cardShadow)"/>
    <!-- Top Accent Bar -->
    <path d="M 0 14 Q 0 0 14 0 L 431 0 Q 445 0 445 14 L 445 6 L 0 6 Z" fill="url(#blueAccent)"/>
    
    <!-- Header -->
    <circle cx="36" cy="38" r="16" fill="#E0F2FE"/>
    <text x="36" y="44" font-size="16" text-anchor="middle">⚙️</text>
    <text x="64" y="34" class="card-title">Backend &amp; Architecture</text>
    <text x="64" y="48" class="card-subtitle" fill="#0284C7">HIGH CONCURRENCY &amp; ENTERPRISE CORE</text>

    <!-- Skill Chips Grid -->
    <!-- Row 1 -->
    <rect x="24" y="70" width="145" height="26" class="badge-blue"/>
    <text x="34" y="87" class="tag-text" fill="#0369A1">⚡ C# ASP.NET Core 8</text>

    <rect x="177" y="70" width="130" height="26" class="badge-bg"/>
    <text x="187" y="87" class="tag-text">Dapper Micro-ORM</text>

    <rect x="315" y="70" width="105" height="26" class="badge-bg"/>
    <text x="325" y="87" class="tag-text">RESTful Web API</text>

    <!-- Row 2 -->
    <rect x="24" y="106" width="145" height="26" class="badge-bg"/>
    <text x="34" y="123" class="tag-text">📡 MQTTnet Broker</text>

    <rect x="177" y="106" width="120" height="26" class="badge-bg"/>
    <text x="187" y="123" class="tag-text">MailKit SMTP</text>

    <rect x="305" y="106" width="115" height="26" class="badge-bg"/>
    <text x="315" y="123" class="tag-text">LDAP SSO Dir</text>

    <!-- Row 3 -->
    <rect x="24" y="142" width="180" height="26" class="badge-bg"/>
    <text x="34" y="159" class="tag-text">Clean &amp; Hexagonal Arch</text>

    <rect x="212" y="142" width="208" height="26" class="badge-bg"/>
    <text x="222" y="159" class="tag-text">SQL Stored Procedure Tuning</text>
  </g>

  <!-- ================= QUADRANT 2: FRONTEND WEB ================= -->
  <g transform="translate(490, 15)">
    <!-- Base Card -->
    <rect width="445" height="195" rx="14" fill="url(#cardGrad)" stroke="#E2E8F0" stroke-width="1.2" filter="url(#cardShadow)"/>
    <!-- Top Accent Bar -->
    <path d="M 0 14 Q 0 0 14 0 L 431 0 Q 445 0 445 14 L 445 6 L 0 6 Z" fill="url(#purpleAccent)"/>
    
    <!-- Header -->
    <circle cx="36" cy="38" r="16" fill="#EDE9FE"/>
    <text x="36" y="44" font-size="16" text-anchor="middle">🌐</text>
    <text x="64" y="34" class="card-title">Frontend Web Platform</text>
    <text x="64" y="48" class="card-subtitle" fill="#7C3AED">MODERN REACT &amp; TURBOPACK ENGINE</text>

    <!-- Skill Chips Grid -->
    <!-- Row 1 -->
    <rect x="24" y="70" width="145" height="26" class="badge-purple"/>
    <text x="34" y="87" class="tag-text" fill="#6D28D9">⚡ Next.js 15 (Turbopack)</text>

    <rect x="177" y="70" width="105" height="26" class="badge-purple"/>
    <text x="187" y="87" class="tag-text" fill="#6D28D9">⚛️ React 19</text>

    <rect x="290" y="70" width="130" height="26" class="badge-bg"/>
    <text x="300" y="87" class="tag-text">TypeScript &amp; ES6+</text>

    <!-- Row 2 -->
    <rect x="24" y="106" width="125" height="26" class="badge-bg"/>
    <text x="34" y="123" class="tag-text">Bootstrap 5 &amp; SASS</text>

    <rect x="157" y="106" width="130" height="26" class="badge-bg"/>
    <text x="167" y="123" class="tag-text">Framer Motion FX</text>

    <rect x="295" y="106" width="125" height="26" class="badge-bg"/>
    <text x="305" y="123" class="tag-text">Tailwind / Vanilla</text>

    <!-- Row 3 -->
    <rect x="24" y="142" width="180" height="26" class="badge-bg"/>
    <text x="34" y="159" class="tag-text">SSR &amp; Client Hydration</text>

    <rect x="212" y="142" width="208" height="26" class="badge-bg"/>
    <text x="222" y="159" class="tag-text">Responsive Dashboard UI/UX</text>
  </g>

  <!-- ================= QUADRANT 3: MOBILE NATIVE ================= -->
  <g transform="translate(15, 230)">
    <!-- Base Card -->
    <rect width="445" height="195" rx="14" fill="url(#cardGrad)" stroke="#E2E8F0" stroke-width="1.2" filter="url(#cardShadow)"/>
    <!-- Top Accent Bar -->
    <path d="M 0 14 Q 0 0 14 0 L 431 0 Q 445 0 445 14 L 445 6 L 0 6 Z" fill="url(#emeraldAccent)"/>
    
    <!-- Header -->
    <circle cx="36" cy="38" r="16" fill="#D1FAE5"/>
    <text x="36" y="44" font-size="16" text-anchor="middle">📱</text>
    <text x="64" y="34" class="card-title">Mobile Native Development</text>
    <text x="64" y="48" class="card-subtitle" fill="#059669">CROSS-PLATFORM &amp; EDGE HARDWARE</text>

    <!-- Skill Chips Grid -->
    <!-- Row 1 -->
    <rect x="24" y="70" width="125" height="26" class="badge-emerald"/>
    <text x="34" y="87" class="tag-text" fill="#047857">📱 React Native</text>

    <rect x="157" y="70" width="115" height="26" class="badge-emerald"/>
    <text x="167" y="87" class="tag-text" fill="#047857">🚀 Expo SDK 54</text>

    <rect x="280" y="70" width="140" height="26" class="badge-bg"/>
    <text x="290" y="87" class="tag-text">Zustand Global State</text>

    <!-- Row 2 -->
    <rect x="24" y="106" width="135" height="26" class="badge-bg"/>
    <text x="34" y="123" class="tag-text">TanStack Query v5</text>

    <rect x="167" y="106" width="145" height="26" class="badge-bg"/>
    <text x="177" y="123" class="tag-text">Push Notification FCM</text>

    <rect x="320" y="106" width="100" height="26" class="badge-bg"/>
    <text x="330" y="123" class="tag-text">QR Scanner</text>

    <!-- Row 3 -->
    <rect x="24" y="142" width="175" height="26" class="badge-bg"/>
    <text x="34" y="159" class="tag-text">Offline-First Sync Engine</text>

    <rect x="207" y="142" width="213" height="26" class="badge-bg"/>
    <text x="217" y="159" class="tag-text">Hardware Sensors &amp; Native APU</text>
  </g>

  <!-- ================= QUADRANT 4: DATABASES & DEVOPS ================= -->
  <g transform="translate(490, 230)">
    <!-- Base Card -->
    <rect width="445" height="195" rx="14" fill="url(#cardGrad)" stroke="#E2E8F0" stroke-width="1.2" filter="url(#cardShadow)"/>
    <!-- Top Accent Bar -->
    <path d="M 0 14 Q 0 0 14 0 L 431 0 Q 445 0 445 14 L 445 6 L 0 6 Z" fill="url(#amberAccent)"/>
    
    <!-- Header -->
    <circle cx="36" cy="38" r="16" fill="#FEF3C7"/>
    <text x="36" y="44" font-size="16" text-anchor="middle">🗄️</text>
    <text x="64" y="34" class="card-title">Databases, DevOps &amp; Tools</text>
    <text x="64" y="48" class="card-subtitle" fill="#D97706">INFRASTRUCTURE &amp; CONTINUOUS PIPELINE</text>

    <!-- Skill Chips Grid -->
    <!-- Row 1 -->
    <rect x="24" y="70" width="155" height="26" class="badge-amber"/>
    <text x="34" y="87" class="tag-text" fill="#B45309">🗄️ Microsoft SQL Server</text>

    <rect x="187" y="70" width="95" height="26" class="badge-amber"/>
    <text x="197" y="87" class="tag-text" fill="#B45309">🐬 MySQL</text>

    <rect x="290" y="70" width="130" height="26" class="badge-bg"/>
    <text x="300" y="87" class="tag-text">🐳 Docker Engine</text>

    <!-- Row 2 -->
    <rect x="24" y="106" width="125" height="26" class="badge-bg"/>
    <text x="34" y="123" class="tag-text">🦊 GitLab CI/CD</text>

    <rect x="157" y="106" width="145" height="26" class="badge-bg"/>
    <text x="167" y="123" class="tag-text">SonarQube Scanner</text>

    <rect x="310" y="106" width="110" height="26" class="badge-bg"/>
    <text x="320" y="123" class="tag-text">Git &amp; GitHub</text>

    <!-- Row 3 -->
    <rect x="24" y="142" width="180" height="26" class="badge-bg"/>
    <text x="34" y="159" class="tag-text">Postman API Testing</text>

    <rect x="212" y="142" width="208" height="26" class="badge-bg"/>
    <text x="222" y="159" class="tag-text">VS Code &amp; Visual Studio Pro</text>
  </g>
</svg>
